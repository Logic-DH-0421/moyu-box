<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的第六个项目</title><style>:root{color-scheme:light dark}body{font:16px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;max-width:600px;margin:70px auto;padding:25px}h1{font-size:28px;font-weight:500}button{font:inherit;padding:10px 20px;border:0;border-radius:9px;background:#496cdf;color:white;cursor:pointer}p{opacity:.75}output{font-size:42px;display:block;margin:20px 0}</style></head><body><h1>这是我的第六个项目</h1><p>一个独立网页项目已经在摸鱼盒子里运行。返回鱼塘再打开，当前页面会保留。</p><output id="value">0</output><button id="count">计数 +1</button><p>计数使用本项目独立的 localStorage 保存。</p><script>const value=document.getElementById('value');let count=Number(localStorage.getItem('counter')||0);value.textContent=count;document.getElementById('count').onclick=()=>{value.textContent=++count;localStorage.setItem('counter',count)};</script></body></html>
