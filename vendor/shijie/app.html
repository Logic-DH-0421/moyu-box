<script>
(function(){
const defaultCats=['通勤','工作','会议','吃饭','摸鱼','睡觉','休息','修正'];
const holidayRanges=[['2026-01-01','2026-01-03','元旦'],['2026-02-15','2026-02-23','春节'],['2026-04-04','2026-04-06','清明节'],['2026-05-01','2026-05-05','劳动节'],['2026-06-19','2026-06-21','端午节'],['2026-09-25','2026-09-27','中秋节'],['2026-10-01','2026-10-07','国庆节']];
const holidays={};
holidayRanges.forEach(function(r){let d=new Date(r[0]+'T12:00:00'),e=new Date(r[1]+'T12:00:00');while(d<=e){holidays[dateKey(d)]=r[2];d.setDate(d.getDate()+1)}});
let records=readRecords(),rules=readRules(),cats=readCats(),parts=readParts(),todos=readTodos(),groups=readGroups(),statConfig=readStatConfig(),durationStyle=readDurationStyle(),view='day',focus=new Date(),category=null,query='',layoutMode=localStorage.getItem('timeTodoLayout')||'both';
if(!localStorage.getItem('timeTodoInitialized')){if(records.length===0){for(let i=0;i<4;i++)records.push(blankRecord(new Date()));saveRecords()}localStorage.setItem('timeTodoInitialized','1')}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function blankRecord(day){return{id:id(),name:'',category:'工作',assigned:dateKey(day),start:'',end:'',running:false,manualDuration:0}}
function readRecords(){try{return JSON.parse(localStorage.getItem('timeTodoV3')||'[]')}catch(e){return[]}}
function saveRecords(){localStorage.setItem('timeTodoV3',JSON.stringify(records))}
function readRules(){try{return JSON.parse(localStorage.getItem('timeTodoRules')||'[]')}catch(e){return[]}}
function saveRules(){localStorage.setItem('timeTodoRules',JSON.stringify(rules))}
function readCats(){try{let x=JSON.parse(localStorage.getItem('timeTodoCats')||'null');return Array.isArray(x)&&x.length?x:defaultCats.slice()}catch(e){return defaultCats.slice()}}
function saveCats(){localStorage.setItem('timeTodoCats',JSON.stringify(cats))}
function readParts(){try{let x=JSON.parse(localStorage.getItem('timeTodoParts')||'null');return Array.isArray(x)&&x.length?x:[{id:'part-a',name:'Part A'}]}catch(e){return[{id:'part-a',name:'Part A'}]}}
function saveParts(){localStorage.setItem('timeTodoParts',JSON.stringify(parts))}
function readTodos(){try{let x=JSON.parse(localStorage.getItem('timeTodoTasks')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveTodos(){localStorage.setItem('timeTodoTasks',JSON.stringify(todos))}
function readGroups(){try{let x=JSON.parse(localStorage.getItem('timeTodoGroups')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveGroups(){localStorage.setItem('timeTodoGroups',JSON.stringify(groups))}
function readStatConfig(){try{let x=JSON.parse(localStorage.getItem('timeTodoStatConfig')||'null');return x&&Array.isArray(x.categories)&&Array.isArray(x.metrics)?x:{categories:defaultCats.slice(),metrics:['total','average','maximum','minimum']}}catch(e){return{categories:defaultCats.slice(),metrics:['total','average','maximum','minimum']}}}
function saveStatConfig(){localStorage.setItem('timeTodoStatConfig',JSON.stringify(statConfig))}
function readDurationStyle(){return localStorage.getItem('timeTodoDurationStyle')==='zh'?'zh':'compact'}
function saveDurationStyle(){localStorage.setItem('timeTodoDurationStyle',durationStyle)}
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(v){return v?new Date(v):null}
function inputValue(v){let d=parse(v);return d?pad(d.getHours())+':'+pad(d.getMinutes()):''}
function recordState(r){return r.start?(r.end?'done':'active'):'pending'}
function applyTime(r,field,value){if(!value){r[field]='';r.running=recordState(r)==='active';saveRecords();render();return}let t=parseFour(value,'时间');if(!t){render();return}let base=new Date((field==='end'&&r.start?dateKey(parse(r.start)):r.assigned||dateKey(focus))+'T12:00:00');base.setHours(t.hours,t.minutes,0,0);if(field==='end'&&r.start&&base<parse(r.start))base.setDate(base.getDate()+1);r[field]=base.toISOString();r.manualDuration=0;if(field==='start')r.assigned=dateKey(base);r.running=recordState(r)==='active';saveRecords();render()}
function applyDuration(r,value){let t=parseFour(value,'时长');if(!t){render();return}if(!r.start&&!r.end&&r.category!=='修正'){alert('常规事件必须先填写开始时间或结束时间，才能编辑时长');render();return}let sec=t.totalMinutes*60;if(r.start){r.end=new Date(parse(r.start).getTime()+sec*1000).toISOString()}else if(r.end){r.start=new Date(parse(r.end).getTime()-sec*1000).toISOString();r.assigned=dateKey(parse(r.start))}else{r.manualDuration=sec}r.running=false;saveRecords();render()}
function seconds(r,now){if(!r.start)return Number(r.manualDuration)||0;let a=parse(r.start),b=parse(r.end)||now;return Math.max(0,Math.floor((b-a)/1000))}
function fmt(s){let total=Math.max(0,Math.floor(Number(s)||0)),h=Math.floor(total/3600),m=Math.floor(total%3600/60);return durationStyle==='zh'?h+'小时'+m+'分':h+'h'+m+'min'}
function excelDuration(s){s=Math.max(0,Math.floor(Number(s)||0));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function durationInput(s){return pad(Math.floor(s/3600))+pad(Math.floor(s%3600/60))}
function parseFour(value,label){let v=String(value||'').replace(/\D/g,'');if(!/^\d{4}$/.test(v)){alert(label+'请填写四位数字，例如 0718');return null}let h=Number(v.slice(0,2)),m=Number(v.slice(2));if(m>59||(label==='时间'&&h>23)){alert(label+'数值不正确');return null}return{hours:h,minutes:m,totalMinutes:h*60+m,text:v}}
function effective(r){return r.start?dateKey(parse(r.start)):r.assigned}
function monday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function range(){let a,b;if(view==='day'){a=new Date(focus);b=new Date(a);b.setDate(b.getDate()+1)}else if(view==='week'){a=monday(focus);b=new Date(a);b.setDate(b.getDate()+7)}else if(view==='month'){a=new Date(focus.getFullYear(),focus.getMonth(),1,12);b=new Date(focus.getFullYear(),focus.getMonth()+1,1,12)}else if(view==='year'){a=new Date(focus.getFullYear(),0,1,12);b=new Date(focus.getFullYear()+1,0,1,12)}else{return null}return[dateKey(a),dateKey(b)]}
function visible(){let rg=range(),arr=records.filter(function(r){return !rg||(effective(r)>=rg[0]&&effective(r)<rg[1])});if(category)arr=arr.filter(r=>r.category===category);if(query)arr=arr.filter(r=>(r.name+' '+r.category).toLowerCase().includes(query));return arr}
function totalForDay(d){let k=dateKey(d),now=new Date();return records.filter(r=>effective(r)===k).reduce((a,r)=>a+seconds(r,now),0)}
function periodLabel(){let rg=range();if(view==='all')return'全部历史记录';if(view==='day')return focus.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});if(view==='week'){return new Date(rg[0]+'T12:00').toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+' — '+new Date(new Date(rg[1]+'T12:00').getTime()-86400000).toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}if(view==='month')return focus.getFullYear()+'年'+(focus.getMonth()+1)+'月';return focus.getFullYear()+'年'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function toolbar(){let unit=view==='day'?'天':view==='week'?'周':view==='month'?'月':'年';return'<div class="period-tools"><button data-shift="-1">‹ 上一'+unit+'</button><div class="period-center"><span class="range-label">'+periodLabel()+'</span></div><button data-shift="1">下一'+unit+' ›</button></div>'}
function renderPeriod(){let html='';if(category){document.getElementById('period').innerHTML='';return}if(view==='all'){html='<div class="period-card">'+renderOverview()+'</div>'}else if(view==='day'){html=''}else if(view==='week'){let a=monday(focus);html='<div class="period-card"><div class="week-calendar">';for(let i=0;i<7;i++){let d=new Date(a);d.setDate(a.getDate()+i);html+='<div class="week-cell '+(dateKey(d)===dateKey(new Date())?'today':'')+'" data-day="'+dateKey(d)+'"><small>'+d.toLocaleDateString('zh-CN',{weekday:'short'})+'</small><div class="bigday">'+d.getDate()+'</div>'+(holidays[dateKey(d)]?'<span class="holiday">'+holidays[dateKey(d)]+'</span>':'')+'<div class="wtime">'+fmt(totalForDay(d))+'</div></div>'}html+='</div></div>'}else if(view==='month'){html='<div class="period-card">'+monthCalendar(focus.getFullYear(),focus.getMonth())+'</div>'}else{html='<div class="period-card"><div class="year-grid">';for(let m=0;m<12;m++){let a=new Date(focus.getFullYear(),m,1),b=new Date(focus.getFullYear(),m+1,1),sum=records.filter(r=>effective(r)>=dateKey(a)&&effective(r)<dateKey(b)).reduce((x,r)=>x+seconds(r,new Date()),0),hc=Object.keys(holidays).filter(k=>k>=dateKey(a)&&k<dateKey(b)).length;html+='<div class="month-card '+(focus.getFullYear()===new Date().getFullYear()&&m===new Date().getMonth()?'current':'')+'" data-month="'+m+'"><h3>'+(m+1)+' 月</h3><strong>'+fmt(sum)+'</strong><small>'+(hc?' · 节假日 '+hc+' 天':'')+'</small></div>'}html+='</div></div>'}document.getElementById('period').innerHTML=html}
function monthCalendar(y,m){let first=new Date(y,m,1,12),start=monday(first),html='<div class="calendar">';['一','二','三','四','五','六','日'].forEach(x=>html+='<div class="weekday">'+x+'</div>');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=dateKey(d);html+='<div class="day-cell '+(d.getMonth()!==m?'out ':'')+(k===dateKey(new Date())?'today':'')+'" data-day="'+k+'"><span class="day-num">'+d.getDate()+'</span>'+(holidays[k]?'<span class="holiday">'+holidays[k]+'</span>':'')+(totalForDay(d)?'<span class="day-time">'+fmt(totalForDay(d))+'</span>':'')+'</div>'}return html+'</div>'}
function renderOverview(){let now=new Date(),html='<div class="overview-grid">';cats.forEach(function(c){let rr=records.filter(r=>r.category===c),s=rr.reduce((a,r)=>a+seconds(r,now),0);html+='<div class="overview-item"><h3>'+c+'</h3><strong>'+fmt(s)+'</strong><small>'+rr.filter(r=>r.start).length+' 项记录</small></div>'});return html+'</div>'}
function renderPeriodCategoryStats(now){let rg=range(),start=new Date(rg[0]+'T12:00:00'),end=new Date(rg[1]+'T12:00:00'),days=[];for(let d=new Date(start);d<end;d.setDate(d.getDate()+1))days.push(dateKey(d));let totals={},periodRecords=records.filter(r=>effective(r)>=rg[0]&&effective(r)<rg[1]);periodRecords.forEach(function(r){let key=effective(r)+'|'+r.category;totals[key]=(totals[key]||0)+seconds(r,now)});let prefix=view==='week'?'本周':view==='month'?'本月':'本年',displayNames={睡觉:'睡眠'},html='<div class="period-stats-note">日均按本周期全部自然日计算；最长、最短按有记录的日期计算。</div>',metricNames={total:prefix,average:'日均',maximum:'最长',minimum:'最短'};cats.filter(c=>statConfig.categories.includes(c)).forEach(function(cat){let name=displayNames[cat]||cat,daily=days.map(day=>totals[day+'|'+cat]||0),total=daily.reduce((a,b)=>a+b,0),positive=daily.filter(x=>x>0),values={total:total,average:days.length?Math.floor(total/days.length):0,maximum:positive.length?Math.max.apply(null,positive):0,minimum:positive.length?Math.min.apply(null,positive):0},metrics=statConfig.metrics.filter(m=>metricNames[m]).map(m=>[metricNames[m]+name+'时间',values[m]]);html+='<div class="category-stat"><h3>'+name+'时间</h3><div class="category-metrics">'+metrics.map(x=>'<div class="category-metric"><small>'+x[0]+'</small><strong>'+fmt(x[1])+'</strong></div>').join('')+'</div></div>'});let box=document.getElementById('stats');box.className='stats period-category-stats';box.innerHTML=html}
function renderStats(){let now=new Date(),scopeTotal=visible().reduce((a,r)=>a+seconds(r,now),0),box=document.getElementById('stats');document.getElementById('grandTotal').textContent=fmt(scopeTotal);if(view==='week'||view==='month'||view==='year'){renderPeriodCategoryStats(now);return}box.className='stats';let today=dateKey(now),todayRecords=records.filter(r=>effective(r)===today),sumCategory=function(names){return todayRecords.filter(r=>names.includes(r.category)).reduce((a,r)=>a+seconds(r,now),0)},work=sumCategory(['工作']),sleep=sumCategory(['睡觉','睡眠']),tomorrow=new Date(now);tomorrow.setHours(24,0,0,0);let remaining=Math.max(0,Math.floor((tomorrow-now)/1000)),occupied=sumCategory(['工作','睡觉','睡眠','吃饭','通勤','修正']),disposable=Math.max(0,86400-occupied);box.innerHTML=[['工作时间',fmt(work)],['睡眠时间',fmt(sleep)],['剩余时间',fmt(remaining)],['可支配时间',fmt(disposable)]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')}
function categoryOptions(selected){return cats.map(c=>'<option '+(c===selected?'selected':'')+'>'+c+'</option>').join('')}
function renderEvents(){if(view!=='day'&&!category){document.getElementById('eventArea').innerHTML='';return}let head='<div class="record-head"><span>类别 / 名称</span><span>开始时间</span><span>结束时间</span><span>持续时间</span><span></span></div>';document.getElementById('eventArea').innerHTML=head+visible().map(r=>{let state=recordState(r);return '<div class="event '+state+'" data-id="'+r.id+'"><div class="category-combo"><input class="category" aria-label="类别或名称" value="'+esc(r.name||r.category)+'"><select class="category-picker" aria-label="切换类别"><option value=""></option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select></div><input aria-label="开始时间" class="start-time" inputmode="numeric" maxlength="5" placeholder="07:18" value="'+inputValue(r.start)+'"><input aria-label="结束时间" class="end-time" inputmode="numeric" maxlength="5" placeholder="18:30" value="'+inputValue(r.end)+'"><input aria-label="持续时间" class="duration-edit" maxlength="12" value="'+fmt(seconds(r,new Date()))+'"><div class="event-controls"><button class="start">'+(state==='active'?'结束':'开始')+'</button><button class="delete" title="删除">×</button></div></div>'}).join('')}
function renderCats(){const shown=['工作','会议','睡觉'];document.getElementById('cats').innerHTML=shown.filter(c=>cats.includes(c)).map(c=>'<li><button data-cat="'+esc(c)+'"><span class="ico">'+({工作:'▣',会议:'♧',睡觉:'☾'}[c]||'▣')+'</span>'+esc(c)+'</button></li>').join('');renderGroups()}

async function syncRun(action){if(syncBusy)return;syncBusy=true;try{await action();if($('#syncConflict')&&!syncPaused)$('#syncConflict').hidden=true}catch(e){if(e.status===409){syncPaused=true;syncMessage('检测到并发修改，请再次点击同步处理冲突')}else syncMessage('同步未完成：'+e.message)}finally{syncBusy=false}}
async function syncNow(){if(!syncSession.token){openSync();return}await syncRun(async()=>{syncMessage('正在同步……');const remote=await syncRequest('/api/snapshot');if(!remote.data){await uploadCloud(0);return}validateSnapshot(remote.data);const hash=syncHash();if(syncRevision===null){if(syncHash(remote.data)===hash){syncRevision=remote.revision;syncBase=hash;syncMessage('数据已一致')}else showSyncConflict(remote);return}if(remote.revision!==syncRevision){if(hash===syncBase)await applyCloud(remote);else showSyncConflict(remote)}else if(hash!==syncBase)await uploadCloud(remote.revision);else syncMessage('已同步 · 无新更改')})}
function openSync(){dialog('账号与同步','<div class="sync-form"><label>同步服务地址<input id="syncServer" placeholder="https://你的同步域名" value="'+esc(syncSession.server||(location.protocol.startsWith('http')?location.origin:''))+'"></label><label>账号<input id="syncUsername" autocomplete="username" value="'+esc(syncSession.username||'')+'"></label><label>密码<input id="syncPassword" type="password" autocomplete="current-password" placeholder="至少 10 个字符"></label><label>注册邀请码（注册时填写）<input id="syncInvite" type="password" autocomplete="off"></label><div class="sync-actions"><button id="syncLogin">登录</button><button id="syncRegister">注册</button><button id="syncLogout">退出登录</button><button id="syncManual">立即同步</button></div><label><span><input id="syncAuto" type="checkbox" '+(syncAuto?'checked':'')+'>本次登录期间自动同步（每 15 秒）</span></label><p class="sync-info">'+(syncSession.token?'已登录：'+esc(syncSession.username):'尚未登录')+'。登录后需主动点击同步。首次发现云端内容时先选择合并或下载；下载前自动备份本地。账号口令不写入工作簿，退出登录保留本地数据。</p><p id="syncResult" class="sync-result">'+esc(syncLast)+'</p><div id="syncConflict" class="sync-conflict" hidden><p id="syncConflictText"></p><div class="sync-actions"><button id="syncMerge">合并双方并上传</button><button id="syncUseCloud">下载云端</button><button id="syncUseLocal">以本地替换云端</button></div></div></div>');
 const authenticate=register=>syncRun(async()=>{const server=syncUrl($('#syncServer').value.trim()),username=$('#syncUsername').value.trim(),password=$('#syncPassword').value,invite=$('#syncInvite').value;const previous=syncSession;syncSession={server};try{const result=await syncRequest(register?'/api/register':'/api/login','POST',{username,password,invite});syncSession={server,username:result.username,token:result.token};sessionStorage.setItem('shijieSyncSession',JSON.stringify(syncSession));localStorage.setItem('shijieSyncServer',JSON.stringify({server,username:result.username}));syncRevision=null;syncBase='';syncAuto=false;syncPaused=false;syncMessage('登录成功，请点击“立即同步”');openSync()}catch(e){syncSession=previous;throw e}});
 $('#syncLogin').onclick=()=>authenticate(false);$('#syncRegister').onclick=()=>authenticate(true);$('#syncManual').onclick=()=>syncNow();$('#syncAuto').onchange=e=>{syncAuto=e.target.checked};$('#syncLogout').onclick=()=>syncRun(async()=>{if(syncSession.token)await syncRequest('/api/logout','POST',{});syncSession={server:syncSession.server,username:syncSession.username};sessionStorage.removeItem('shijieSyncSession');syncAuto=false;syncRevision=null;syncBase='';syncPaused=false;syncMessage('已退出登录，本地数据保留');openSync()});
}
$('#actionMenu').insertAdjacentHTML('beforeend','<button id="accountSync">账号与同步</button>');$('#accountSync').onclick=()=>{openSync();$('#actionMenu').classList.remove('show')};
setInterval(()=>{if(syncAuto&&!syncPaused&&!syncBusy&&syncSession.token&&!$('.modal-back.show')&&document.visibilityState==='visible')syncNow()},15000);
window.addEventListener('online',()=>{if(syncAuto&&!syncPaused)syncNow()});
Object.assign(window.ShijieTest,{syncNow,openSync,getSync:()=>({revision:syncRevision,paused:syncPaused,busy:syncBusy,message:syncLast})});

renderCats();render();applyBackground();applyFixedRules();setInterval(function(){applyFixedRules();renderStats();if(records.some(r=>recordState(r)==='active')){document.querySelectorAll('.event').forEach(function(el){let r=records.find(x=>x.id===el.dataset.id),field=el.querySelector('.duration-edit');if(r&&recordState(r)==='active'&&field!==document.activeElement)field.value=fmt(seconds(r,new Date()))})}},1000);
})();
</script>
</body></html>
